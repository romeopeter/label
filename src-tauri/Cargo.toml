[package]
name = "layer"
version = "0.1.0"
description = "Layer — desktop-first branded graphics editor"
edition = "2024"
rust-version = "1.90"

[lib]
name = "layer_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
